name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  # The debug build, lint and the JVM unit tests. Instrumented tests on an
  # emulator get their own job.
  gradle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGP 9.4 needs JDK 17 or later; the build machine uses Temurin 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Installs the SDK pieces the build uses (compileSdk 37, Build-Tools
      # 36.0.0) and accepts their licenses, so Gradle downloads nothing
      # mid-build.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      # Caches Gradle's files and checks the wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug lint testDebugUnitTest --stacktrace
