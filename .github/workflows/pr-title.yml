name: PR title
# GitHub can use either the PR title or the sole commit's subject for a squash.
# Validate both with the PR-number suffix, so the check covers either setting.
# Title edits run this check without restarting the emulator jobs.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  squash-subject:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # commitlint 21 needs Node 22.12 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # The title goes through the environment, never into the script's text.
      - name: Lint the title as the squash commit's subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          printf '%s (#%s)\n' "$TITLE" "$NUMBER" | npx --no -- commitlint --verbose
          if [ "$COMMITS" = 1 ]; then
            subject=$(git log -1 --format=%s)
            printf '%s (#%s)\n' "$subject" "$NUMBER" | npx --no -- commitlint --verbose
          fi
