name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  # The debug build, then `check`: lint, the JVM unit tests and
  # :app:checkDeniedDependencies, which fails when Play Services, Firebase or
  # another denied group reaches the release runtime classpath. Instrumented
  # tests on an emulator get their own job.
  gradle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGP 9.4 needs JDK 17 or later; the build machine uses Temurin 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Installs the SDK pieces the build uses (compileSdk 37, Build-Tools
      # 36.0.0) and accepts their licenses, so Gradle downloads nothing
      # mid-build.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      # Caches Gradle's files and checks the wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug check --stacktrace

  # Builds the unsigned release APK twice from clean with
  # scripts/reproducible-release.sh and fails when the two APKs differ.
  # F-Droid publishes the project-signed APK only when its own build matches.
  # The script clones the checked-out commit, which works from the shallow
  # fetch of actions/checkout. The job sets no TOKKL_RELEASE_* signing
  # variable, and the script unsets them for its builds anyway.
  reproducible-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: scripts/reproducible-release.sh

  # The instrumented tests on an API 36 and an API 31 emulator, against the
  # Tokkl image that scripts/instrumented-tests.sh pins by digest.
  # android-emulator-runner boots the emulator; the script sees an attached
  # device, so it starts and seeds the server and runs the tests without
  # booting one of its own. TOKKL_TEST_THROWAWAY_EMULATOR=1 tells it that the
  # device is a throwaway emulator, so it installs the run's CA there as a
  # user CA with the default image's su and runs UserCaCertificateTest too,
  # as on an emulator it boots. API 31 is Android 12, the oldest version the app
  # supports, so it catches a call to an API newer than the device. The
  # screenshot tests do not run there, since their references come from API 36.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api-level: [36, 31]
    name: instrumented-tests (API ${{ matrix.api-level }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # From android-emulator-runner's README. The emulator on GitHub's Ubuntu
      # runners can use KVM only after this rule opens /dev/kvm to every user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The AVD follows tokkl-api36 and tokkl-api31: the plain AOSP image,
      # which keeps SystemUI and the launcher, on a medium phone with 2 GB of
      # RAM. -accel on and disable-linux-hw-accel: false make the job fail
      # without KVM instead of falling back to software emulation. Animations
      # stay on, as they do locally. The runner runs each script line on its
      # own with sh -c. The first two turn off error dialogs, the third lets
      # the soft keyboard open and the fourth makes apps draw with Vulkan, as
      # the script does on an emulator it boots itself. qemu kept about 100 MB
      # after every app process that drew with OpenGL, and the test
      # orchestrator starts one per test, so a full run grew it by about 10 GB.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-linux-hw-accel: false
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell setprop debug.hwui.renderer skiavk
            TOKKL_TEST_THROWAWAY_EMULATOR=1 scripts/instrumented-tests.sh
      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  # Macrobenchmark (macrobenchmark/) on an API 36 emulator set up as above:
  # cold start, and the time from a Start or Stop tap on the Timer page until
  # the screen shows what it did. The 1.5 s and 200 ms goals are for a
  # mid-range phone, which the emulator is not, so they gate nothing. Instead
  # the job fails when a median is more than 10% above the one of the last
  # green run on main (scripts/compare-benchmarks.sh). Each run on main that
  # passes the comparison stores its results as an artifact, and a later run
  # takes them from the newest run on main whose every job passed. Without
  # such a run, or once its artifact has expired, the job only reports the
  # medians. The benchmarks sign in to the server that
  # scripts/instrumented-tests.sh starts, so the script runs them, beside the
  # app's tests in the api package, which check that server first; the
  # script fails a run in which the app's tests did not run.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # gh run list and gh run download read the earlier runs' artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-linux-hw-accel: false
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell setprop debug.hwui.renderer skiavk
            TOKKL_TEST_THROWAWAY_EMULATOR=1 scripts/instrumented-tests.sh :macrobenchmark:connectedBenchmarkAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.github.e0ipso.tokkl.benchmark,com.github.e0ipso.tokkl.api
      - name: Preserve benchmark test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            macrobenchmark/build/outputs/androidTest-results/connected/
            macrobenchmark/build/reports/androidTests/connected/
            macrobenchmark/build/outputs/connected_android_test_additional_output/**/*.xml
            macrobenchmark/build/outputs/connected_android_test_additional_output/**/*.png
          if-no-files-found: ignore
      - name: Collect the results
        run: |
          mkdir benchmark-results
          find macrobenchmark/build/outputs/connected_android_test_additional_output -name '*-benchmarkData.json' -exec cp {} benchmark-results/ \;
      - name: Download the results of the last green run on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::notice::No green run on main yet, so there is nothing to compare with."
          elif ! gh run download "$run_id" --name macrobenchmark-results --dir benchmark-baseline; then
            echo "::notice::Run $run_id on main has no macrobenchmark-results artifact, so there is nothing to compare with."
          fi
      - run: scripts/compare-benchmarks.sh benchmark-baseline benchmark-results
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrobenchmark-results
          path: benchmark-results/
          if-no-files-found: error
          retention-days: 90

  # Lints the commit messages and runs the tests of the commitlint rules. The
  # commit-msg hook never sees the message git revert or cherry-pick writes, a
  # commit made with --no-verify, or one from a clone without npm install.
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # commitlint 21 needs Node 22.12 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The PR's commits, or the pushed ones. After a force push the old tip is
      # gone, so only the last commit is linted.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - run: npm test

  # Release only after every check passed, using Tokkl's release rules. This
  # commits the changelog and Gradle version and creates the v* tag. The APK
  # must be built from that commit, because AGP embeds its hash in the APK.
  release:
    needs: [gradle, reproducible-release, instrumented-tests, benchmarks, commitlint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check signing secrets before creating a release
        env:
          TOKKL_RELEASE_KEYSTORE_BASE64: ${{ secrets.TOKKL_RELEASE_KEYSTORE_BASE64 }}
          TOKKL_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TOKKL_RELEASE_KEYSTORE_PASSWORD }}
          TOKKL_RELEASE_KEY_ALIAS: ${{ secrets.TOKKL_RELEASE_KEY_ALIAS }}
          TOKKL_RELEASE_KEY_PASSWORD: ${{ secrets.TOKKL_RELEASE_KEY_PASSWORD }}
        run: |
          for name in TOKKL_RELEASE_KEYSTORE_BASE64 TOKKL_RELEASE_KEYSTORE_PASSWORD TOKKL_RELEASE_KEY_ALIAS TOKKL_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Actions secret $name. See README.md, Sign the release APK."
              exit 1
            fi
          done
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  # A clean checkout of the new tag gives F-Droid the same source revision.
  # This job can read the signing key, but cannot write repository contents.
  android-release:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the signed release APK
        env:
          TOKKL_RELEASE_KEYSTORE_BASE64: ${{ secrets.TOKKL_RELEASE_KEYSTORE_BASE64 }}
          TOKKL_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.TOKKL_RELEASE_KEYSTORE_PASSWORD }}
          TOKKL_RELEASE_KEY_ALIAS: ${{ secrets.TOKKL_RELEASE_KEY_ALIAS }}
          TOKKL_RELEASE_KEY_PASSWORD: ${{ secrets.TOKKL_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TOKKL_RELEASE_KEYSTORE_BASE64 TOKKL_RELEASE_KEYSTORE_PASSWORD TOKKL_RELEASE_KEY_ALIAS TOKKL_RELEASE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "::error::Missing Actions secret $name"; exit 1; }
          done
          test "$TAG" = "v$(sed -n 's/^versionName=//p' gradle/version.properties)"
          git diff --exit-code HEAD
          export TOKKL_RELEASE_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$TOKKL_RELEASE_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$TOKKL_RELEASE_KEYSTORE_BASE64" | base64 -d >"$TOKKL_RELEASE_KEYSTORE"
          ./gradlew --no-daemon --no-build-cache assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          mkdir release-apk
          cp app/build/outputs/apk/release/app-release.apk "release-apk/tokkl-android-${TAG#v}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-${{ needs.release.outputs.tag }}
          path: release-apk/*.apk
          if-no-files-found: error
          overwrite: true

  # As in Tokkl's desktop jobs, publishing holds the write token and consumes
  # the build artifact. Re-running this job replaces the same release asset.
  android-publish:
    needs: [release, android-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-${{ needs.release.outputs.tag }}
          path: release-apk
      - name: Attach the APK to the release
        run: |
          gh release upload "$TAG" \
            "release-apk/tokkl-android-${TAG#v}.apk#Tokkl for Android 12 or later" --clobber
