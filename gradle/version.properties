# The app version, and the only place it is set. The release step rewrites
# both values. versionName is MAJOR.MINOR.PATCH. versionCode must equal the
# formula in app/build.gradle.kts, and the build fails when it does not.
# F-Droid reads both values from this file at each v* tag, through the
# UpdateCheckData line quoted in app/build.gradle.kts, so keep each one on
# its own line in key=value form.
versionName=0.4.0
versionCode=4000
