# The build machine is shared with other services, so keep the heap small.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon instead of a second, long-lived daemon.
kotlin.compiler.execution.strategy=in-process
# Store task outputs in the local build cache in the Gradle user home, so a new
# git worktree reuses what another worktree already compiled from the same
# inputs. Parallel sittings start from the same commit and would otherwise each
# compile the whole app from nothing.
org.gradle.caching=true
kotlin.code.style=official
android.useAndroidX=true
