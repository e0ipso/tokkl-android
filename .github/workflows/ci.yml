name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  # The debug build, then `check`: lint, the JVM unit tests and
  # :app:checkDeniedDependencies, which fails when Play Services, Firebase or
  # another denied group reaches the release runtime classpath. Instrumented
  # tests on an emulator get their own job.
  gradle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # AGP 9.4 needs JDK 17 or later; the build machine uses Temurin 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Installs the SDK pieces the build uses (compileSdk 37, Build-Tools
      # 36.0.0) and accepts their licenses, so Gradle downloads nothing
      # mid-build.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      # Caches Gradle's files and checks the wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew assembleDebug check --stacktrace

  # Builds the unsigned release APK twice from clean with
  # scripts/reproducible-release.sh and fails when the two APKs differ.
  # F-Droid publishes the project-signed APK only when its own build matches.
  # The script clones the checked-out commit, which works from the shallow
  # fetch of actions/checkout. The job sets no TOKKL_RELEASE_* signing
  # variable, and the script unsets them for its builds anyway.
  reproducible-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: scripts/reproducible-release.sh

  # The instrumented tests on an API 36 emulator, against the Tokkl image that
  # scripts/instrumented-tests.sh pins by digest. android-emulator-runner
  # boots the emulator; the script sees an attached device, so it starts and
  # seeds the server and runs the tests without booting one of its own.
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # From android-emulator-runner's README. The emulator on GitHub's Ubuntu
      # runners can use KVM only after this rule opens /dev/kvm to every user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The AVD follows tokkl-api36: the plain AOSP image, which keeps SystemUI
      # and the launcher, on a medium phone with 2 GB of RAM. -accel on and
      # disable-linux-hw-accel: false make the job fail without KVM instead of
      # falling back to software emulation. Animations stay on, as they do
      # locally. The runner runs each script line on its own with sh -c. The
      # first two turn off error dialogs, the third lets the soft keyboard
      # open and the fourth makes apps draw with Vulkan, which the script does
      # only on an emulator it boots itself. qemu kept about 100 MB after every
      # app process that drew with OpenGL, and the test orchestrator starts one
      # per test, so a full run grew it by about 10 GB.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-linux-hw-accel: false
          disable-animations: false
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell setprop debug.hwui.renderer skiavk
            scripts/instrumented-tests.sh

  # Lints the commit messages and runs the tests of the commitlint rules. The
  # commit-msg hook never sees the message git revert or cherry-pick writes, a
  # commit made with --no-verify, or one from a clone without npm install.
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # commitlint 21 needs Node 22.12 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      # The PR's commits, or the pushed ones. After a force push the old tip is
      # gone, so only the last commit is linted.
      - name: Lint commit messages
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git cat-file -e "$FROM^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$FROM" --to "$TO" --verbose
          else
            npx --no -- commitlint --last --verbose
          fi

      - run: npm test
